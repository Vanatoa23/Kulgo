services:
  arcadedb:
    image: arcadedata/arcadedb:26.11.1
    container_name: kulgo-arcadedb
    restart: unless-stopped
    # Local development bind ONLY on loopback (never expose 0.0.0.0 in production).
    # In production (Hetzner / Coolify), remove `ports` so ArcadeDB is reachable
    # exclusively over the private `kulgo-internal` Docker network.
    ports:
      - "127.0.0.1:2480:2480"
    environment:
      JAVA_OPTS: >-
        -Darcadedb.server.rootPassword=${ARCADEDB_PASSWORD:-kulgo-dev-password-change-me}
        -Darcadedb.server.mode=production
        -Darcadedb.server.plugins=
    volumes:
      - arcadedb_data:/home/arcadedb/databases
    networks:
      - kulgo-internal
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/2480'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: kulgo-api
    restart: unless-stopped
    depends_on:
      arcadedb:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
      SESSION_SECRET: ${SESSION_SECRET:-kulgo-dev-session-secret-change-in-prod}
      ARCADEDB_URL: http://arcadedb:2480
      ARCADEDB_DATABASE: ${ARCADEDB_DATABASE:-kulgo}
      ARCADEDB_USER: ${ARCADEDB_USER:-root}
      ARCADEDB_PASSWORD: ${ARCADEDB_PASSWORD:-kulgo-dev-password-change-me}
    ports:
      - "127.0.0.1:4000:4000"
    networks:
      - kulgo-internal

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: kulgo-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"
    networks:
      - kulgo-internal

volumes:
  arcadedb_data:

networks:
  kulgo-internal:
    driver: bridge
