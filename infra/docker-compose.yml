services:
  arcadedb:
    image: arcadedata/arcadedb:26.11.1
    container_name: kulgo-arcadedb
    restart: unless-stopped
    # Local development / host-only admin bind on loopback (127.0.0.1).
    # In production (Hetzner / Coolify / reverse-proxy host), remove `ports`
    # completely so ArcadeDB is reachable exclusively over `kulgo-internal`.
    ports:
      - "127.0.0.1:2480:2480"
    environment:
      JAVA_OPTS: >-
        -Darcadedb.server.rootPassword=${ARCADEDB_PASSWORD:?ARCADEDB_PASSWORD must be set (min 12 chars, no weak defaults)}
        -Darcadedb.server.mode=production
        -Darcadedb.server.plugins=
    volumes:
      - arcadedb_data:/home/arcadedb/databases
    networks:
      - kulgo-internal
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/2480'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: kulgo-api
    restart: unless-stopped
    depends_on:
      arcadedb:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: ${PORT:-4000}
      WEB_ORIGIN: ${WEB_ORIGIN:?WEB_ORIGIN must be set (e.g. https://app.kulgo.example)}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set (min 32 random chars)}
      ARCADEDB_URL: http://arcadedb:2480
      ARCADEDB_DATABASE: ${ARCADEDB_DATABASE:-kulgo}
      ARCADEDB_USER: ${ARCADEDB_USER:-root}
      ARCADEDB_PASSWORD: ${ARCADEDB_PASSWORD:?ARCADEDB_PASSWORD must be set}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_AUTH_MAX: ${RATE_LIMIT_AUTH_MAX:-20}
      RATE_LIMIT_IMPORT_MAX: ${RATE_LIMIT_IMPORT_MAX:-10}
      MAX_JSON_BODY_BYTES: ${MAX_JSON_BODY_BYTES:-1048576}
      MAX_IMPORT_BODY_BYTES: ${MAX_IMPORT_BODY_BYTES:-5242880}
    # Bound to loopback for host health checks; `web` proxies `/api/*` over `kulgo-internal`.
    ports:
      - "127.0.0.1:4000:4000"
    networks:
      - kulgo-internal

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: kulgo-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
    networks:
      - kulgo-internal

volumes:
  arcadedb_data:

networks:
  kulgo-internal:
    driver: bridge
